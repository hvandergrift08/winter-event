<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation: Falcon Frost</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A1A4A;      /* deep royal night */
  --night-2:#122563;    /* raised panels */
  --royal:#2A5BF0;      /* Ross royal blue */
  --frost:#EAF2FF;      /* main text */
  --ice:#8FD0FF;        /* accents, links */
  --dim:#A9B9E6;        /* secondary text */
  --stamp:#E5483C;      /* errors, warnings */
  --tinsel:#F4C54A;     /* winners, highlights */
  --ok:#5FE0A8;
  --line:rgba(234,242,255,.16);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs:clamp(17px, 1.45vw, 30px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--night);
  background-image:radial-gradient(ellipse 90% 55% at 50% -10%, rgba(143,208,255,.22), transparent 70%);
  background-attachment:fixed;
  color:var(--frost);font-family:var(--body);font-size:var(--fs);line-height:1.45;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--ice)}
:focus-visible{outline:3px solid var(--tinsel);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;letter-spacing:.01em}
.hidden{display:none!important}
.muted{color:var(--dim)}
.small{font-size:.8em}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  border:2px solid var(--line);background:rgba(255,255,255,.06);
  padding:.55em 1.1em;border-radius:12px;cursor:pointer;font-weight:700;
  min-height:2.6em;text-decoration:none;color:var(--frost);
}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.primary:hover{background:#3B6BFF}
.btn.big{font-size:1.25em;padding:.6em 1.4em;border-radius:14px}
.btn.danger{border-color:var(--stamp);color:#ffd6d2}
.btn.danger:hover{background:rgba(229,72,60,.18)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--frost);background:rgba(255,255,255,.06)}
.btn.sm{font-size:.78em;min-height:2.2em;padding:.35em .8em;border-radius:9px}

input[type=text],input[type=password],input[type=number],select{
  background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:12px;
  padding:.55em .8em;min-height:2.6em;width:100%;
}
input:focus,select:focus{border-color:var(--ice);outline:none}
label{display:block;font-weight:700;margin:0 0 .35em}

/* ---------- layout ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.center-screen{flex:1;display:grid;place-items:center;padding:4vh 4vw}
.narrow{width:min(560px,100%)}
.narrow .mark{font-size:clamp(2.6rem,5.5vw,5.5rem)}
.stack>*+*{margin-top:1rem}

/* teacher top bar */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;
  padding:.7rem 2vw;border-bottom:1px solid var(--line);background:rgba(5,14,44,.55);
  position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);
}
.who{display:flex;align-items:center;gap:.7em;min-width:0}
.who strong{font-family:var(--display);font-size:1.6em;font-weight:800;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.4em;font-size:.72em;font-weight:700;
  padding:.2em .7em;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.clock-wrap{text-align:center;line-height:1}
.clock{font-family:var(--display);font-weight:900;font-size:3.1em;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock-sub{font-size:.7em;color:var(--dim);margin-top:.15em;min-height:1.2em}
.clock-sub .pen{color:#ffb4ac}
.clock-sub .cred{color:var(--ok)}
.status{justify-self:end;display:flex;align-items:center;gap:.6em;font-size:.75em;color:var(--dim)}
.dot{width:.7em;height:.7em;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.off{background:var(--stamp)}
.dot.warn{background:var(--tinsel)}

/* teacher stage */
.stage{flex:1;padding:3vh 5vw 8.5em;width:100%;max-width:1500px;margin:0 auto}
.step-count{color:var(--ice);font-weight:700;font-size:.85em;margin-bottom:.4em}
.stage h1{font-size:3.2em;margin-bottom:.45em}
.mission-body{max-width:68ch}
.mission-body p{margin:.2em 0 .9em}
.mission-body ol{margin:0 0 1em;padding-left:1.4em}
.mission-body li{margin:.45em 0;padding-left:.3em}
.mission-body li::marker{font-family:var(--display);font-weight:900;color:var(--ice);font-size:1.15em}
.callout{border-left:6px solid var(--tinsel);padding:.5em .9em;background:rgba(244,197,74,.09);border-radius:0 10px 10px 0}

.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:1rem 5vw;background:rgba(5,14,44,.92);border-top:1px solid var(--line);
}
.actionbar .left,.actionbar .right{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.waiting{display:flex;align-items:center;gap:.7em;font-weight:700}
.pulse{width:.9em;height:.9em;border-radius:50%;background:var(--tinsel);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* video */
.video-box{position:relative;width:100%;max-width:min(1400px, calc(64vh * 16 / 9));aspect-ratio:16/9;margin:0 auto;
  background:#000;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.video-box iframe,.video-box>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2em;
  background:repeating-linear-gradient(135deg,#0d1f57 0 22px,#0b1a4a 22px 44px)}
.video-placeholder h2{font-size:2.2em;margin-bottom:.3em}
.video-title{text-align:center;font-size:2.4em;margin-bottom:.5em}
.recap{max-width:68ch;margin:1.2em auto 0;padding:1em 1.2em;border:2px dashed var(--line);border-radius:14px}
.recap h3{font-size:1.3em;margin-bottom:.3em;color:var(--ice)}

/* lobby + countdown */
.mark{font-family:var(--display);font-weight:900;font-size:clamp(3rem,8vw,9rem);line-height:.9;letter-spacing:.01em;text-align:center;
  color:var(--frost);text-shadow:0 0 40px rgba(143,208,255,.35)}
.mark small{display:block;font-size:.3em;color:var(--ice);font-weight:800;margin-bottom:.3em}
.countdown{font-family:var(--display);font-weight:900;font-size:min(42vh,34vw);line-height:1;font-variant-numeric:tabular-nums;color:var(--frost);
  text-shadow:0 0 60px rgba(143,208,255,.5)}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:.7em;align-items:flex-start;padding:.45em 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:0}
.checklist .dot{margin-top:.38em}

.panel{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.6rem}

/* overlay + modals */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,9,30,.78);display:grid;place-items:center;padding:3vh 3vw;backdrop-filter:blur(4px)}
.modal{background:var(--night-2);border:2px solid var(--line);border-radius:20px;padding:1.6rem 1.8rem;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h2{font-size:2em;margin-bottom:.5em}
.modal .row{display:flex;gap:.8rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.4rem}
.code-input{font-family:var(--display)!important;font-weight:800;font-size:2.4em!important;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:.3em .5em!important}
.prefix{font-size:1.3em;font-weight:700;margin-bottom:.4em;color:var(--ice)}
.feedback{min-height:1.6em;margin-top:.7em;font-weight:700;color:#ffb4ac}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}

.hint-list{list-style:none;padding:0;margin:0}
.hint-list li{padding:.9em 1em;border:2px solid var(--line);border-radius:14px;margin-bottom:.8em}
.hint-list .hint-head{font-weight:700;color:var(--ice);font-size:.85em;margin-bottom:.25em}
.hint-list .locked{color:var(--dim);border-style:dashed}

/* the stamp: one big orchestrated moment */
.stamp-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(3,9,30,.9);pointer-events:none}
.stamp{font-family:var(--display);font-weight:900;font-size:min(14vw,11rem);line-height:.9;text-align:center;color:var(--ok);
  border:.08em solid var(--ok);border-radius:.12em;padding:.1em .3em;transform:rotate(-6deg);
  animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
.stamp small{display:block;font-size:.32em;color:var(--frost)}
@keyframes stamp{0%{transform:rotate(-6deg) scale(2.4);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp,.shake,.pulse{animation:none}}

/* pause */
.pause-layer{position:fixed;inset:0;z-index:40;background:rgba(3,9,30,.94);display:grid;place-items:center;text-align:center}

/* finish */
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:1rem;margin:1.6rem 0}
.result-grid .panel{text-align:center;padding:1rem}
.result-grid .num{font-family:var(--display);font-weight:900;font-size:2.6em;font-variant-numeric:tabular-nums;line-height:1}
.result-grid .final .num{color:var(--tinsel)}

/* ---------- leaderboard ---------- */
.board{padding:3vh 3vw 4vh;max-width:1800px;margin:0 auto}
[data-board]{padding-bottom:7rem}
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap;margin-bottom:2vh}
.board-head h1{font-size:3.4em}
.board-head .clock{font-size:3.6em}
.teams{display:grid;gap:1rem}
.team-row{display:grid;grid-template-columns:3.2em 1fr auto;gap:1.2rem;align-items:center;
  background:var(--night-2);border:1px solid var(--line);border-left:10px solid var(--tc);border-radius:16px;padding:1rem 1.4rem}
.rank{font-family:var(--display);font-weight:900;font-size:3em;line-height:1;color:var(--tc);text-align:center}
.team-name{font-family:var(--display);font-weight:800;font-size:2em;line-height:1}
.team-meta{color:var(--dim);font-size:.8em;margin:.2em 0 .6em}
.team-avg{text-align:right}
.team-avg .num{font-family:var(--display);font-weight:900;font-size:3.2em;line-height:1;font-variant-numeric:tabular-nums}
.team-avg .lbl{font-size:.7em;color:var(--dim)}
.room-chips{display:flex;flex-wrap:wrap;gap:.5em}
.room-chip{font-size:.72em;padding:.25em .7em;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);white-space:nowrap}
.room-chip.done{background:var(--tc);color:#06123a;border-color:var(--tc);font-weight:700}
.room-chip.capped{background:rgba(229,72,60,.25);border-color:var(--stamp)}
.finish-list{margin-top:3vh}
.finish-list h2{font-size:2em;margin-bottom:.6em}
.finish-table{width:100%;border-collapse:collapse}
.finish-table td,.finish-table th{padding:.45em .6em;border-bottom:1px solid var(--line);text-align:left}
.finish-table th{color:var(--dim);font-weight:700;font-size:.75em}
.finish-table td.t{font-family:var(--display);font-weight:800;font-size:1.3em;font-variant-numeric:tabular-nums}
.board-note{color:var(--dim);font-size:.75em;margin-top:1em}
.leader-badge{color:var(--tinsel);font-weight:700;font-size:.8em}

/* ---------- control panel ---------- */
.ctl{padding:1.2rem 2vw 4rem;font-size:clamp(14px,1vw,18px);max-width:1900px;margin:0 auto}
.ctl-head{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.ctl-head h1{font-size:2.4em}
.ctl-head .clock{font-size:3.4em}
.ctl-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:.8rem;flex-wrap:wrap;margin:0 0 1.2rem}
.stat{background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:.5em .9em}
.stat b{font-family:var(--display);font-size:1.7em;font-weight:900;margin-right:.25em}
.stat.alert{border-color:var(--stamp)}
.team-block{margin-bottom:1.3rem}
.team-block h2{font-size:1.6em;margin-bottom:.5rem;color:var(--tc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.card{background:var(--night-2);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:14px;padding:.8rem .95rem;display:flex;flex-direction:column;gap:.35rem}
.card.stuck{box-shadow:0 0 0 2px var(--tinsel) inset}
.card.offline{opacity:.75}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.card .rm{font-family:var(--display);font-weight:900;font-size:1.6em;line-height:1}
.card .step{font-weight:700}
.card .meta{font-size:.85em;color:var(--dim);display:flex;flex-wrap:wrap;gap:.2em .9em}
.card .warnline{font-size:.85em;color:#ffcf6b}
.card .done-line{font-family:var(--display);font-weight:900;font-size:1.5em;color:var(--tinsel)}
.ctl-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.4rem}
@media (max-width:1100px){.ctl-grid{grid-template-columns:1fr}}
.log{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:1rem;max-height:80vh;overflow:auto;font-size:.88em}
.log h2{font-size:1.5em;margin-bottom:.5em}
.log div{padding:.3em 0;border-bottom:1px solid var(--line)}
.log time{color:var(--dim);margin-right:.5em;font-variant-numeric:tabular-nums}
.action-list{display:grid;gap:.6rem}
.action-list .btn{justify-content:flex-start;text-align:left}

/* ---------- library ---------- */
.lib{padding:1.5rem 3vw 4rem;max-width:1500px;margin:0 auto}
.lib-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.lib-head h1{font-size:2.8em}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem}
.lib-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:.2em;padding:1rem 1.1rem;border-radius:16px;
  background:var(--night-2);border:2px solid var(--line);border-left:10px solid var(--tc);min-height:8.5em}
.lib-btn:hover{background:#18307a}
.lib-btn:focus-visible{outline:3px solid var(--tinsel);outline-offset:3px}
.lib-btn .rm{font-family:var(--display);font-weight:900;font-size:2.6em;line-height:1}
.lib-btn .tn{font-weight:700}
.lib-btn .act{margin-top:auto;font-size:.85em;color:var(--ice)}
.lib-btn.done{background:rgba(95,224,168,.1);border-color:var(--ok)}
.lib-btn.done .act{color:var(--ok)}
.lib-btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}

/* demo / practice banner */
.mode-banner{position:fixed;right:.8rem;bottom:.8rem;z-index:70;font-size:13px;font-weight:700;padding:.35em .8em;border-radius:8px;background:var(--tinsel);color:#1a1300;pointer-events:none}
.with-actionbar .mode-banner{bottom:6.4rem}

.fatal{max-width:640px}
.fatal h1{font-size:2.6em;margin-bottom:.4em;color:#ffb4ac}


/* ---------- preview tools ---------- */
.pv-tools{position:fixed;right:1rem;top:6.5rem;z-index:45;width:320px;font-size:14px;line-height:1.35;background:#081436;border:2px solid var(--tinsel);border-radius:14px;padding:.8rem .9rem;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.pv-tools.mini{width:auto;padding:.3rem;border-width:1px}
.pv-tools .pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;color:var(--tinsel)}
.pv-tools label{font-size:13px;margin:.2rem 0}
.pv-tools select{min-height:2.2em;padding:.25em .5em;border-radius:9px}
.pv-tools .pv-code{margin:.6rem 0;padding:.45rem .6rem;border-radius:9px;background:rgba(244,197,74,.1)}
.pv-tools .pv-btns{display:flex;flex-wrap:wrap;gap:.4rem}

/* ---------- builder ---------- */
.bld{font-size:16px;padding:1rem 1.5rem 3rem;max-width:2000px;margin:0 auto}
.bld-head{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.bld-head h1{font-size:2.4em}
.bld-status{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;color:var(--dim);font-size:.9em;margin-top:.2em}
.bld-file{margin-left:1em}
.bld-tabs,.bld-links{display:flex;gap:.5rem;flex-wrap:wrap}
.bld-steps{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(0,.95fr);gap:1.4rem;align-items:start}
@media (max-width:1350px){.bld-steps{grid-template-columns:240px minmax(0,1fr)}.bld-preview{grid-column:1 / -1;order:-1}}
@media (max-width:800px){.bld-steps{grid-template-columns:1fr}}
.bld-list ol{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.bld-item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;width:100%;padding:.55rem .75rem;border-radius:12px;border:1px solid var(--line);background:var(--night-2);border-left:5px solid var(--royal)}
.bld-item.vid{border-left-color:var(--ice);background:rgba(18,37,99,.55)}
.bld-item:hover{background:#18307a}
.bld-item.on{outline:2px solid var(--tinsel);outline-offset:1px;background:#1a3485}
.bld-item:focus-visible{outline:3px solid var(--tinsel)}
.bld-kind{font-size:.75em;color:var(--dim)}
.bld-name{font-weight:700}
.bld-meta{font-size:.8em;color:var(--dim)}
.warn-txt{color:#ffcf6b}
.bld-add{display:flex;gap:.5rem;margin:.8rem 0 .3rem}
.bld-editor{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.4rem}
.bld-ed-head{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.bld-ed-head h2{font-size:1.9em}
.bld-ed-btns{display:flex;gap:.4rem}
.bld-field{margin-bottom:1rem}
.bld-field label{font-size:.9em}
.bld-field textarea,.hint-ed textarea{width:100%;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:12px;padding:.55em .8em;font:inherit;color:inherit;resize:vertical}
.bld-field textarea:focus,.hint-ed textarea:focus{border-color:var(--ice);outline:none}
.help{color:var(--dim);font-size:.85em;margin:.3em 0 0}
.note{border-left:5px solid var(--ice);background:rgba(143,208,255,.08);padding:.6em .9em;border-radius:0 10px 10px 0;margin:0 0 1rem}
.bld-section{border-top:1px solid var(--line);padding-top:1rem;margin-top:1.4rem}
.bld-section h3{font-size:1.5em;margin-bottom:.5rem}
.rte-bar{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.4rem}
.rte{min-height:14em;max-width:none;padding:.8em 1em;border:2px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);font-size:1.05em}
.rte:focus{border-color:var(--ice);outline:none}
.hint-ed{border:1px solid var(--line);border-radius:12px;padding:.7rem;margin-bottom:.6rem}
.hint-ed-top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.4rem}
.hint-ed-top strong{margin-right:auto}
.hint-ed .mins{display:flex;align-items:center;gap:.4em;font-weight:400;font-size:.85em;margin:0}
.hint-ed .mins input{width:5em;min-height:2.1em;padding:.2em .5em}
.yt-thumb{display:flex;gap:.8rem;align-items:center;margin:-.4rem 0 1rem}
.yt-thumb img{width:160px;border-radius:8px;border:1px solid var(--line)}
.bld-preview{position:sticky;top:1rem}
.pv-frame{position:relative;width:100%;overflow:hidden;border-radius:12px;border:2px solid var(--line);background:#000}
.pv-frame iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0}
.bld-sheet-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:1rem}
.bld-sheet-head h2{font-size:2em}
.issues{border:2px solid #ffcf6b;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
.issues ul{margin:.3rem 0 0;padding-left:1.2rem}
.issues.ok{border-color:var(--ok)}
.sheet{width:100%;border-collapse:collapse}
.sheet th,.sheet td{text-align:left;vertical-align:top;padding:.55em .7em;border-bottom:1px solid var(--line)}
.sheet th{color:var(--dim);font-size:.85em}
.bld-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem;align-items:start}
.bld-settings h2{font-size:1.6em;margin-bottom:.4rem}
.row-btns{display:flex;gap:.6rem;flex-wrap:wrap}
@media print{
  body{background:#fff!important;color:#000}
  .bld-head,.mode-banner,.bld-sheet-head button{display:none!important}
  .muted,.help{color:#444!important}
  .sheet th,.sheet td{border-color:#bbb}
  .issues{border-color:#999}
  .warn-txt{color:#a15c00}
}
@media (max-width:760px){
  .topbar{grid-template-columns:1fr auto}
  .topbar .status{display:none}
  .stage h1{font-size:2.3em}
  .team-row{grid-template-columns:2.2em 1fr;}
  .team-avg{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay-root"></div>

<!-- Content and config (edit these files) -->
<script src="content.js"></script>
<script src="firebase-config.js"></script>

<!-- Firebase (only used when firebase-config.js is filled in) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- YouTube player API -->
<script>
  window.__ytReady = false;
  window.onYouTubeIframeAPIReady = function(){ window.__ytReady = true; document.dispatchEvent(new Event('yt-ready')); };
</script>
<script src="https://www.youtube.com/iframe_api" async></script>

<script src="app.js"></script>
</body>
</html>
